<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>o juta e sike mi</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/flubber"></script>
  <style>
    svg {
      width: 400px;
      height: 400px;
      max-width: 100%;
/*       border: 1px solid #ccc; */
/*       background: #f9f9f9; */
    }
    .shape {
      fill: steelblue;
      stroke: #333;
      stroke-width: 1;
    }
    .lake {
      fill: white;
      stroke: #333;
      stroke-width: 1;
    }
    h1 {
        font-family: "Comic Sans MS", sans-serif;
    }
    button {
        font-family: inherit;
        font-size: inherit;
    }
  </style>
</head>
<body>
<center>
<h1><button id="button" onclick="o_juta()">o juta e sike mi</button></h1>

<svg viewBox="150 200 530 700">
  <path class="shape" id="morph-shape" />
  <path class="lake" id="morph-shape-lake" />
</svg>
</center>
<script>
  const path = d3.select("#morph-shape");
  const pathLake = d3.select("#morph-shape-lake");

  // From Wikipedia Commons:
  // https://commons.wikimedia.org/wiki/File:BlankMap-USA-Utah.svg
  // Salt Lake removed
  const utahPath = "m276 813-48-1v-34c3-55 4-109 4-164l1-16v-16l1-17v-1l-1-1c1-2 4-75 7-176l1-44h210v92l18-1 125-1 13 377-66 1-265 2z";
  const saltLakePath = "M365 465c2-3 5-5 6-5l1-1 1-2c2-1 2-2 1-3-2-1-2-3 0-2h5c3-1 4-2 6-6s2-5 1-5l-3-1h-3l-8-12-8-11-3-3v-7c2-3 2-4 1-6l-1-3c2-1 4 0 7 4 4 4 7 5 9 4 1-1-4-6-6-6l-2-2c-1-2-2-2-7-2s-5-1-5-3 0-2 5-1c5 0 6-1 3-2-3-2-10-1-11 1l1 6 2 10c1 7 0 11-5 11-4 1-4 1-5-3l-1-4-1-4c1-4 1-4-1-5-5-2-12-6-15-9-2-4-3-4-1-8l3-10 2-4-3 1-10 2c-6 1-8 1-8-1-2-2-4-2-4 1-1 1 0 8 1 14 2 10 2 13 1 15-2 3-1 12 1 13l6 1c3-1 4-1 6 4 3 6 3 10 1 13-1 2-1 3 1 5l5 4c2 1 3 2 3 7l-1 5c-2 1-1 3 2 6l6 3 11 2 10 3z";

  const circlePath = (() => {
    // Circle path (approximate using arc commands)
    const circlePath = d3.path();
    const cx = 410, cy = 550, r = 250;
    circlePath.moveTo(cx + r, cy);
    circlePath.arc(cx, cy, r, 0, 2 * Math.PI);
    return circlePath.toString();
  })();

  const tinyCirclePath = (() => {
    // Circle path (approximate using arc commands)
    const circlePath = d3.path();
    const cx = 340, cy = 420, r = 0;
    circlePath.moveTo(cx + r, cy);
    circlePath.arc(cx, cy, r, 0, 2 * Math.PI);
    return circlePath.toString();
  })();


  // Set initial shape (circle)
  path.attr("d", circlePath);
  pathLake.attr("d", tinyCirclePath);

  let button = document.getElementById("button");

  function o_juta() {
    button.onclick = () => {};
    let interpolator = flubber.interpolate(circlePath, utahPath);
    let interpolatorLake = flubber.interpolate(tinyCirclePath, saltLakePath);
    path.transition().duration(500)
    .attrTween("d", () => t => interpolator(t));
    pathLake.transition().duration(500)
    .attrTween("d", () => t => interpolatorLake(t));

    setTimeout(() => {
      button.onclick = () => {o_sike()};
      button.innerHTML = "o sike e juta mi";
    }, 400)
  }
  function o_sike() {
    button.onclick = () => {};
    let interpolator = flubber.interpolate(utahPath, circlePath);
    let interpolatorLake = flubber.interpolate(saltLakePath, tinyCirclePath);
    path.transition().duration(500)
    .attrTween("d", () => t => interpolator(t));
    pathLake.transition().duration(500)
    .attrTween("d", () => t => interpolatorLake(t));

    setTimeout(() => {
      button.onclick = () => {o_juta()};
      button.innerHTML = "o juta e sike mi";
    }, 400)
  }
</script>

</body>
</html>
